<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
<title>TanelCMD</title>
<!--
╔══════════════════════════════════════════════════════════════════╗
║  TanelCMD v9 — CHANGE LOG                                       ║
╠══════════════════════════════════════════════════════════════════╣
║  NEW vs v8:                                                      ║
║  • Codebase split into separate JS files under js/              ║
║    index.html is now a shell — it only loads scripts in order   ║
║    and mounts the app. All logic lives in the js/ files.        ║
║  • Inline comments throughout explaining architecture decisions  ║
║                                                                  ║
║  RETAINED FROM v8:                                               ║
║  • Edit button in Detail view — full edit mode for all fields   ║
║  • Delete button in Detail view with inline confirmation         ║
║  • Add to Calendar button on items with a deadline               ║
║  • Milestone editing in Settings                                 ║
║  • Training log in Training item detail view (Garmin sync)      ║
║  • Zero personal data in source code                             ║
║  • Config + milestones read from Drive JSON                      ║
║  • Setup screen (Script URL + token, localStorage only)          ║
║  • Token auth on every request                                   ║
║  • Local-first startup, background Drive sync                    ║
║  • All task management, categories, deadlines, notes             ║
║  • Custom Mo–Su date picker, dd/mm/yyyy                          ║
║  • Status quick-change dropdown in Detail view header            ║
║  • Sync status indicator, reset connection                       ║
╚══════════════════════════════════════════════════════════════════╝

NOTE FOR LOCAL DEVELOPMENT:
  Opening index.html directly from disk (file://) will NOT work —
  browsers block relative <script src="js/..."> fetches over the
  file:// protocol for security reasons.
  Use a simple local server instead:
    npx serve .
    python -m http.server 8080
  GitHub Pages serves over HTTPS so no changes are needed there.
-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/syne@5.0.3/700.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/dm-mono@5.0.3/400.css"/>
<script src="https://cdn.jsdelivr.net/npm/preact@10.22.0/dist/preact.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/preact@10.22.0/hooks/dist/hooks.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<style>*{box-sizing:border-box;margin:0;padding:0}body{background:#f9fafb;font-family:'DM Mono','Courier New',monospace;-webkit-tap-highlight-color:transparent}</style>
</head>
<body>
<div id="R" style="max-width:680px;margin:0 auto;min-height:100vh;background:#f9fafb"></div>

<!--
  Wire up Preact globals. These lines run before any component file loads,
  making h / html / useState / useEffect / useRef available as plain globals
  throughout every JS file. No bundler or import statements needed —
  all files share one JS scope (the browser window object).
-->
<script>
var h         = preact.h;
var render    = preact.render;
var useState  = preactHooks.useState;
var useEffect = preactHooks.useEffect;
var useRef    = preactHooks.useRef;
var html      = htm.bind(h);
</script>

<!-- Load order matters: each file depends only on what came before it. -->
<script src="js/theme.js"></script>      <!-- colours, fonts, shared style objects -->
<script src="js/utils.js"></script>      <!-- pure helper functions, no dependencies -->
<script src="js/storage.js"></script>    <!-- defaults, localStorage helpers, Drive API -->
<script src="js/components.js"></script> <!-- DatePicker, Pill, Lbl, NavBar, ItemCard -->
<script src="js/views/HomeView.js"></script>
<script src="js/views/ScheduleView.js"></script>
<script src="js/views/ListView.js"></script>
<script src="js/views/DetailView.js"></script>
<script src="js/views/AddView.js"></script>
<script src="js/views/SettingsView.js"></script>
<script src="js/views/SetupView.js"></script>
<script src="js/app.js"></script>        <!-- App component + render call — must be last -->
</body>
</html>
